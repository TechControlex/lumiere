<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration: j&#230;vn overflade">
  <defs>
    <filter id="fineTex" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.14" numOctaves="2" seed="4" result="t" />
      <feColorMatrix in="t" type="matrix" values="
        0.4 0 0 0 0.35
        0.4 0 0 0 0.3
        0.4 0 0 0 0.28
        0 0 0 0.22 0" />
    </filter>
    <radialGradient id="baseA" cx=".45" cy=".3" r=".95">
      <stop offset="0" stop-color="#fdeee2" />
      <stop offset=".5" stop-color="#f3ddcd" />
      <stop offset="1" stop-color="#e3c6b3" />
    </radialGradient>
    <radialGradient id="glowA" cx=".5" cy=".38" r=".55">
      <stop offset="0" stop-color="#fff" stop-opacity=".7" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#baseA)" />
  <rect width="800" height="600" fill="url(#glowA)" />
  <rect width="800" height="600" filter="url(#fineTex)" opacity=".4" style="mix-blend-mode:soft-light" />
</svg>
